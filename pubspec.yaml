name: beauty_rosha
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.11+83

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  device_info_plus: ^10.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.0.9
  local_auth: ^2.1.8
  flutter_cache_manager: ^3.3.0
  http: ^1.2.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^10.1.4
  app_links: ^6.0.0
  photo_view: ^0.15.0
  firebase_crashlytics: ^4.3.5
  firebase_analytics: ^11.6.0
  flutter_inappwebview: ^6.1.5
  collection: ^1.18.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^22.0.1
  image_picker: ^1.1.2
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  flutter_map_cache: ^2.1.0
  connectivity_plus: ^6.0.0
  in_app_review: ^2.0.10
  package_info_plus: ^8.1.2
  video_player: ^2.9.0
  visibility_detector: ^0.4.0
  dio_cache_interceptor: ^4.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/flags/
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/payment/
    - assets/banners/
    - assets/certificates/
  fonts:
    - family: NBRB
      fonts:
        - asset: assets/fonts/nbrb.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700