name: beauty_rosha
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.38+2112

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^13.3.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  cached_network_image: ^4.0.4
  flutter_svg: ^2.0.9
  local_auth: ^3.0.2
  flutter_cache_manager: ^3.3.0
  http: ^1.2.0
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  share_plus: ^13.3.1
  app_links: ^7.2.1
  photo_view: ^0.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  flutter_inappwebview: ^6.1.5
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.0.1
  image_picker: ^1.1.2
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  dio_cache_interceptor: ^4.0.7
  flutter_map_cache: ^2.1.0
  connectivity_plus: ^6.1.5
  in_app_review: ^2.0.10
  package_info_plus: ^10.2.2
  video_player: ^2.9.0
  visibility_detector: ^0.4.0
  path_provider: ^2.1.5
  rive: ^0.14.11
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rive/
    - assets/mascot/parts/
    - assets/mascot/
    - assets/flags/
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/payment/
    - assets/certificates/
  fonts:
    - family: NBRB
      fonts:
        - asset: assets/fonts/nbrb.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700